# Plan morning-digest § 3/4 (ADR 0003): the preview is built here and deployed to Pages as an
# artifact, never committed. The marker comes from the LANE_MARKER secret; delete the secret
# and run this again to upload the same page "no marker set" over the same link.
name: preview
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx -y pnpm@10 install --frozen-lockfile
      - run: cp .env.example .env
      - run: scripts/save-preview.sh _site/index.html /digest/2026-10-28
        env: { LANE_MARKER: "${{ secrets.LANE_MARKER }}" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
